<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elo — Support my art</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --orange: #ff6b1a;
    --orange-light: #ff8c45;
    --orange-pale: #fff0e6;
    --navy: #0f1b2d;
    --navy-mid: #1e3050;
    --navy-light: #2a4470;
    --white: #ffffff;
    --off-white: #f8f6f3;
    --text-muted: #6b7a99;
    --card-bg: #ffffff;
    --border: #d8e0ee;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--off-white);
    color: var(--navy);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    position: relative;
    overflow-x: hidden;
  }

  .bg-photo {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    opacity: 0.1;
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 100% 0%, #ff6b1a18 0%, transparent 55%),
      radial-gradient(ellipse 60% 40% at 0% 100%, #0f1b2d15 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  /* HEADER */
  .header {
    text-align: center;
    width: 100%;
  }

  .name {
    font-family: 'Syne', sans-serif;
    font-size: clamp(3.8rem, 16vw, 5.5rem);
    font-weight: 800;
    color: var(--navy);
    line-height: 0.95;
    letter-spacing: -0.03em;
    text-transform: uppercase;
  }

  .name span {
    color: var(--orange);
    display: inline-block;
    position: relative;
  }

  .tagline {
    margin-top: 0.6rem;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* DIVIDER */
  .divider {
    width: 100%;
    height: 2px;
    background: linear-gradient(to right, var(--orange), var(--navy-light), transparent);
    border-radius: 2px;
    opacity: 0.35;
  }

  /* MESSAGE */
  .message {
    text-align: center;
    font-size: 1rem;
    font-weight: 500;
    color: var(--navy-mid);
    line-height: 1.65;
    max-width: 340px;
  }

  /* AMOUNT SECTION */
  .amount-section { width: 100%; }

  .section-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--orange);
    text-align: center;
    margin-bottom: 0.75rem;
    display: block;
  }

  .preset-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
    margin-bottom: 1.3rem;
  }

  .preset-btn {
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 0.75rem 0.2rem;
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--navy);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    line-height: 1;
    position: relative;
  }

  .preset-btn:hover {
    border-color: var(--orange);
    color: var(--orange);
    transform: translateY(-2px);
  }

  .preset-btn.active {
    background: var(--orange);
    border-color: var(--orange);
    color: var(--white);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(255,107,26,0.3);
  }

  .preset-btn.popular {
    border-color: var(--navy-light);
  }

  .popular-badge {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--orange);
    text-transform: uppercase;
    margin-top: 3px;
  }

  .preset-btn.active .popular-badge {
    color: rgba(255,255,255,0.8);
  }

  .custom-row {
    display: flex;
    align-items: center;
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .custom-row:focus-within {
    border-color: var(--orange);
  }

  .currency-symbol {
    padding: 0 0 0 1rem;
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-muted);
    line-height: 1;
    user-select: none;
  }

  .custom-input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 0.75rem 0.5rem 0.75rem 0.35rem;
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--navy);
    outline: none;
    width: 100%;
  }

  .custom-input::placeholder { color: var(--border); }

  /* PAYMENT CARDS */
  .cards-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--orange);
    text-align: center;
    display: block;
    margin-bottom: 0.75rem;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    width: 100%;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 0.85rem 1rem;
    text-decoration: none;
    color: inherit;
    transition: all 0.15s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .card:hover {
    border-color: var(--orange);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,107,26,0.15);
  }

  .card-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 1.4rem;
    line-height: 1;
  }

  .card-info { flex: 1; min-width: 0; }

  .card-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--navy);
    line-height: 1.2;
  }

  .card-detail {
    font-size: 0.73rem;
    color: var(--text-muted);
    margin-top: 2px;
    font-weight: 500;
  }

  .card-cards {
    font-size: 1.1rem;
    letter-spacing: 0.05em;
    margin-top: 3px;
    display: block;
  }

  .card-amount-badge {
    font-size: 0.68rem;
    background: var(--orange-pale);
    color: var(--orange);
    border: 1.5px solid #ffd4b8;
    border-radius: 20px;
    padding: 2px 7px;
    font-weight: 700;
    margin-top: 3px;
    display: inline-block;
  }

  .card-arrow {
    color: var(--navy-light);
    font-size: 1.1rem;
    font-style: normal;
    font-weight: 700;
    transition: transform 0.2s, color 0.15s;
    flex-shrink: 0;
  }

  .card:hover .card-arrow {
    color: var(--orange);
    transform: translateX(3px);
  }

  /* NAVY ACCENT on bizum card */
  .card-bizum { border-left: 4px solid var(--orange); }
  .card-revolut { border-left: 4px solid var(--navy-mid); }
  .card-paypal { border-left: 4px solid #003087; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy);
    color: var(--white);
    padding: 0.65rem 1.3rem;
    border-radius: 30px;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* INSTAGRAM */
  .instagram-link {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    color: var(--white);
    background: var(--navy);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    transition: all 0.2s;
    text-transform: uppercase;
    padding: 0.85rem 1.6rem;
    border-radius: 50px;
    border: 2px solid var(--navy);
    width: 100%;
    justify-content: center;
  }

  .instagram-link:hover {
    background: var(--orange);
    border-color: var(--orange);
    color: var(--white);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,107,26,0.3);
  }

  .footer-note {
    text-align: center;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .icon-bizum { background: #fff0e6; }
  .icon-revolut { background: #eef0f8; }
  .icon-paypal { background: #e8eef8; }
</style>
</head>
<body>

<div class="bg-photo" id="bg-photo"></div>

<div class="container">

  <div class="header">
    <h1 class="name"><span>Elo</span></h1>
    <p class="tagline">Artist</p>
  </div>

  <div class="divider"></div>

  <p class="message">Thank you for supporting independent art.</p>

  <div class="divider"></div>

  <!-- Amount picker -->
  <div class="amount-section">
    <span class="section-label">Preset tips</span>
    <div class="preset-grid">
      <button class="preset-btn" onclick="selectAmount(5, this)">€5</button>
      <button class="preset-btn popular" onclick="selectAmount(10, this)">
        €10 ⭐
        <span class="popular-badge">Popular</span>
      </button>
      <button class="preset-btn" onclick="selectAmount(15, this)">€15</button>
      <button class="preset-btn" onclick="selectAmount(null, this)">Own</button>
    </div>
    <div class="custom-row" id="custom-row" style="display:none;">
      <span class="currency-symbol">€</span>
      <input class="custom-input" type="number" id="custom-amount" placeholder="Enter amount" min="1" oninput="onCustomInput()" />
    </div>
  </div>

  <!-- Payment methods -->
  <div style="width:100%">
    <span class="cards-label">Pay via</span>
    <div class="cards">

      <!-- Bizum -->
      <div class="card card-bizum" onclick="copyBizum()">
        <div class="card-icon icon-bizum">
          <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
            <rect width="40" height="40" rx="8" fill="#FF6B00" opacity="0.15"/>
            <text x="20" y="27" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="800" fill="#FF6B00">Biz</text>
          </svg>
        </div>
        <div class="card-info">
          <div class="card-name">Bizum</div>
          <div class="card-detail">+34 623 47 42 83</div>
          <span class="card-amount-badge" id="bizum-amount-badge" style="display:none"></span>
        </div>
        <span class="card-arrow">⎘</span>
      </div>

      <!-- Revolut -->
      <a class="card card-revolut" id="revolut-card" href="https://revolut.me/elo_rd" target="_blank" rel="noopener">
        <div class="card-icon icon-revolut">
          <svg width="28" height="28" viewBox="0 0 26 26" fill="none">
            <path d="M7 4h7.5C17.5 4 20 6.2 20 9c0 2-1.1 3.6-2.8 4.4L20 18h-4l-2.7-4.5H10.5V18H7V4zm3.5 7h3.8c1.2 0 2.2-.9 2.2-2s-1-2-2.2-2h-3.8v4z" fill="#191C33"/>
          </svg>
        </div>
        <div class="card-info">
          <div class="card-name">Card &amp; Revolut</div>
          <div class="card-detail">revolut.me/elo_rd</div>
          <span class="card-cards">💳 🪙 🏦 💶</span>
          <span class="card-amount-badge" id="revolut-amount-badge" style="display:none"></span>
        </div>
        <span class="card-arrow">→</span>
      </a>

      <!-- PayPal -->
      <a class="card card-paypal" id="paypal-card" href="https://www.paypal.me/ERiberaDucreux" target="_blank" rel="noopener">
        <div class="card-icon icon-paypal">
          <svg width="28" height="28" viewBox="0 0 26 26" fill="none">
            <path d="M8.5 20l.8-4.5h3.2c3.5 0 5.8-1.8 6.4-5 .5-2.8-1-4.5-3.8-4.5H9.3L6 20h2.5zm1.7-9.5h3.2c1.4 0 2.2.7 1.9 2.1-.3 1.4-1.4 2.1-2.8 2.1H9.7l.5-4.2z" fill="#003087"/>
          </svg>
        </div>
        <div class="card-info">
          <div class="card-name">PayPal</div>
          <div class="card-detail">paypal.me/ERiberaDucreux</div>
          <span class="card-amount-badge" id="paypal-amount-badge" style="display:none"></span>
        </div>
        <span class="card-arrow">→</span>
      </a>

    </div>
  </div>

  <a class="instagram-link" href="https://instagram.com/elo__rd" target="_blank" rel="noopener">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="20" height="20" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
    </svg>
    Support @elo__rd
  </a>



</div>

<div class="toast" id="toast"></div>

<script>
  let selectedAmount = null;

  function selectAmount(val, btn) {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const customRow = document.getElementById('custom-row');
    const customInput = document.getElementById('custom-amount');

    if (val === null) {
      customRow.style.display = 'flex';
      customInput.focus();
      selectedAmount = null;
    } else {
      customRow.style.display = 'none';
      customInput.value = '';
      selectedAmount = val;
    }
    updateBadges();
  }

  function onCustomInput() {
    const val = parseFloat(document.getElementById('custom-amount').value);
    selectedAmount = (val && val > 0) ? val : null;
    updateBadges();
  }

  function updateBadges() {
    const ids = ['bizum-amount-badge', 'revolut-amount-badge', 'paypal-amount-badge'];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (selectedAmount) {
        el.style.display = 'inline-block';
        el.textContent = '€' + selectedAmount + ' selected';
      } else {
        el.style.display = 'none';
      }
    });

    const paypalBase = 'https://www.paypal.me/ERiberaDucreux';
    const paypalCard = document.getElementById('paypal-card');
    paypalCard.href = selectedAmount ? paypalBase + '/' + selectedAmount + 'EUR' : paypalBase;

    const revolutBase = 'https://revolut.me/elo_rd';
    document.getElementById('revolut-card').href = revolutBase;
  }

  function copyBizum() {
    const phone = '+34623474283';
    const msg = selectedAmount
      ? '📋 Number copied — send €' + selectedAmount + ' via Bizum!'
      : '📋 Number copied!';

    const copy = () => showToast(msg);

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(phone).then(copy).catch(() => {
        fallback(phone); copy();
      });
    } else {
      fallback(phone); copy();
    }
  }

  function fallback(text) {
    const el = document.createElement('textarea');
    el.value = text;
    el.style.cssText = 'position:fixed;opacity:0;';
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  // To set your background photo:
  // document.getElementById('bg-photo').style.backgroundImage = "url('YOUR_PHOTO.jpg')";
</script>

</body>
</html>

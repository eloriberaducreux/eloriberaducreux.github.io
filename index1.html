<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elo — Support my art</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --orange: #ff6b1a;
    --orange-light: #ff8c45;
    --orange-pale: #3a1f0a;
    --navy: #0f1b2d;
    --navy-mid: #1e3050;
    --navy-light: #2a4470;
    --white: #ffffff;
    --off-white: #f8f6f3;
    --text-muted: #8fa3c4;
    --card-bg: #1a2d47;
    --border: #2a4470;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--navy);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    position: relative;
    overflow-x: hidden;
  }

  .bg-photo {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    opacity: 0.1;
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 100% 0%, rgba(255,107,26,0.12) 0%, transparent 55%),
      radial-gradient(ellipse 60% 40% at 0% 100%, rgba(42,68,112,0.4) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    width: 100%;
  }

  .side-photo {
    width: 130px;
    height: auto;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
    order: 2;
  }

  .cutout-photo { display: none; }

  .header-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    order: 1;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3.4rem, 14vw, 5rem);
    font-weight: 300;
    color: var(--white);
    line-height: 1;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .name span {
    color: var(--orange);
    display: inline-block;
    font-style: italic;
    font-weight: 400;
    position: relative;
  }

  .tagline {
    margin-top: 0.4rem;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: left;
  }

  /* DIVIDER */
  .divider {
    width: 100%;
    height: 2px;
    background: linear-gradient(to right, var(--orange), var(--navy-light), transparent);
    border-radius: 2px;
    opacity: 0.35;
  }

  /* MESSAGE */
  .message {
    text-align: center;
    font-size: 1rem;
    font-weight: 500;
    color: var(--text-muted);
    line-height: 1.65;
    max-width: 340px;
  }

  /* AMOUNT SECTION */
  .amount-section { width: 100%; margin-top: 0.8rem; }

  .section-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--orange);
    text-align: center;
    margin-bottom: 0.75rem;
    display: block;
  }

  .preset-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
    margin-bottom: 1.3rem;
  }

  .preset-btn {
    background: var(--navy-mid);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 0.75rem 0.2rem;
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--white);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    line-height: 1;
    position: relative;
  }

  .preset-btn:hover {
    border-color: var(--orange);
    color: var(--orange);
    transform: translateY(-2px);
  }

  .preset-btn.active {
    background: var(--orange);
    border-color: var(--orange);
    color: var(--white);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(255,107,26,0.3);
  }

  .preset-btn.popular {
    border-color: var(--navy-light);
  }

  .popular-badge {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--orange);
    text-transform: uppercase;
    margin-top: 3px;
  }

  .preset-btn.active .popular-badge {
    color: rgba(255,255,255,0.8);
  }

  .custom-row {
    display: flex;
    align-items: center;
    background: var(--navy-mid);
    border: 2px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .custom-row:focus-within {
    border-color: var(--orange);
  }

  .currency-symbol {
    padding: 0 0 0 1rem;
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-muted);
    line-height: 1;
    user-select: none;
  }

  .custom-input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 0.75rem 0.5rem 0.75rem 0.35rem;
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--white);
    outline: none;
    width: 100%;
  }

  .custom-input::placeholder { color: var(--navy-light); }

  /* PAYMENT CARDS */
  .cards-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--orange);
    text-align: center;
    display: block;
    margin-bottom: 0.75rem;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    width: 100%;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    background: var(--navy-mid);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 0.85rem 1rem;
    text-decoration: none;
    color: inherit;
    transition: all 0.15s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .card:hover {
    border-color: var(--orange);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,107,26,0.15);
  }

  .card-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    background: #ffffff;
  }

  .card-icon img {
    width: 28px;
    height: 28px;
    object-fit: contain;
  }

  .card-info { flex: 1; min-width: 0; }

  .card-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--white);
    line-height: 1.2;
  }

  .card-detail {
    display: none;
  }

  .card-logos {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 5px;
  }

  .card-logos svg {
    display: block;
    flex-shrink: 0;
  }

  .card-amount-badge {
    font-size: 0.68rem;
    background: var(--orange-pale);
    color: var(--orange-light);
    border: 1.5px solid #5a2d0a;
    border-radius: 20px;
    padding: 2px 7px;
    font-weight: 700;
    margin-top: 3px;
    display: inline-block;
  }

  .card-arrow {
    color: var(--navy-light);
    font-size: 1.1rem;
    font-style: normal;
    font-weight: 700;
    transition: transform 0.2s, color 0.15s;
    flex-shrink: 0;
  }

  .card:hover .card-arrow {
    color: var(--orange);
    transform: translateX(3px);
  }

  /* NAVY ACCENT on bizum card */
  .card-bizum { border-left: 4px solid var(--orange); }
  .card-revolut { border-left: 4px solid var(--navy-mid); }
  .card-paypal { border-left: 4px solid #003087; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--orange);
    color: var(--white);
    padding: 0.65rem 1.3rem;
    border-radius: 30px;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* INSTAGRAM */
  .instagram-link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    color: var(--orange);
    background: transparent;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: all 0.2s;
    text-transform: uppercase;
    padding: 0.85rem 1.4rem;
    border-radius: 50px;
    border: 2px solid var(--orange);
    width: 100%;
    justify-content: center;
  }

  .instagram-link:hover {
    background: var(--orange);
    color: var(--white);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,107,26,0.3);
  }

  .ig-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.3;
  }

  .profile-photo-wrap {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--orange);
    box-shadow: 0 0 0 4px rgba(255,107,26,0.2);
    flex-shrink: 0;
  }

  .profile-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    filter: grayscale(20%);
  }

  .ig-handle {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    text-transform: lowercase;
    display: block;
  }

  .instagram-link:hover .ig-handle {
    color: rgba(255,255,255,0.75);
  }

  .footer-note {
    text-align: center;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .icon-bizum { background: #3a1f0a; }
  .icon-revolut { background: #1a2540; }
  .icon-paypal { background: #0a1a35; }
  .icon-wise { background: #0d2a1a; }
  .card-wise { border-left: 4px solid #9fe870; }
</style>
</head>

<script>
  let selectedAmount = null;

  function selectAmount(val, btn) {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const customRow = document.getElementById('custom-row');
    const customInput = document.getElementById('custom-amount');

    if (val === null) {
      customRow.style.display = 'flex';
      customInput.focus();
      selectedAmount = null;
    } else {
      customRow.style.display = 'none';
      customInput.value = '';
      selectedAmount = val;
    }
    updateBadges();
  }

  function onCustomInput() {
    const val = parseFloat(document.getElementById('custom-amount').value);
    selectedAmount = (val && val > 0) ? val : null;
    updateBadges();
  }

  function updateBadges() {
    const ids = ['bizum-amount-badge', 'revolut-amount-badge', 'paypal-amount-badge', 'wise-amount-badge'];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (selectedAmount) {
        el.style.display = 'inline-block';
        el.textContent = '€' + selectedAmount + ' selected';
      } else {
        el.style.display = 'none';
      }
    });

    const paypalBase = 'https://www.paypal.me/ERiberaDucreux';
    const paypalCard = document.getElementById('paypal-card');
    paypalCard.href = selectedAmount ? paypalBase + '/' + selectedAmount + 'EUR' : paypalBase;

    const revolutBase = 'https://revolut.me/elo_rd';
    document.getElementById('revolut-card').href = revolutBase;
  }

  function copyBizum() {
    const phone = '+34623474283';
    const msg = selectedAmount
      ? '📋 Number copied — send €' + selectedAmount + ' via Bizum!'
      : '📋 Number copied!';

    const copy = () => showToast(msg);

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(phone).then(copy).catch(() => {
        fallback(phone); copy();
      });
    } else {
      fallback(phone); copy();
    }
  }

  function fallback(text) {
    const el = document.createElement('textarea');
    el.value = text;
    el.style.cssText = 'position:fixed;opacity:0;';
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  // To set your background photo:
  // document.getElementById('bg-photo').style.backgroundImage = "url('YOUR_PHOTO.jpg')";
</script>
